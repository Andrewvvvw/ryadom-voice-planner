services:
  ryadom:
    build: .
    ports:
      - "127.0.0.1:${RYADOM_HTTP_PORT:-3001}:3000"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_SEARCH: ${LLM_SEARCH:-false}
    volumes:
      - ryadom-data:/app/.local
    restart: unless-stopped
volumes:
  ryadom-data:
